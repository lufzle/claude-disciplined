[package]
name = "claude-disciplined"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Dario Farzati"]
license = "AGPL-3.0-only"
description = "Workflow enforcement system for Claude Code — companion CLI and hook binary"
repository = "https://github.com/lufzle/claude-disciplined"
keywords = ["claude", "workflow", "hooks", "traceability"]
categories = ["command-line-utilities"]

[[bin]]
name = "workflow"
path = "src/bin/workflow.rs"

[[bin]]
name = "workflow-hook"
path = "src/bin/workflow_hook.rs"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
claude-disciplined = { path = ".", features = ["test-support"] }
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Selectively allow pedantic lints that create noise without value
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Nursery lints worth enabling
cognitive_complexity = "warn"
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
empty_line_after_doc_comments = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
use_self = "warn"
